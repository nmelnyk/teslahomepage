<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Montessori Interactive Calendar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100vh;
            max-height: 100vh;
            width: 100vw;
            max-width: 100vw;
            touch-action: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            overscroll-behavior: none;
            overflow: hidden !important;
            font-family: 'Fredoka', cursive, sans-serif;
        }

        /* Number Tile Styling & Animations */
        .number-tile {
            touch-action: none !important;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            will-change: transform;
            transition: transform 0.15s cubic-bezier(0.2, 0, 0.13, 2), box-shadow 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .number-tile:active {
            transform: scale(1.08);
        }

        /* Selected State for Tap-to-Place Mode */
        .number-tile.selected-tile {
            transform: scale(1.12) translateY(-2px);
            outline: 3px solid #f59e0b;
            outline-offset: 2px;
            box-shadow: 0 8px 20px -3px rgba(245, 158, 11, 0.6);
            animation: pulseGlow 1.2s infinite ease-in-out alternate;
        }

        @keyframes pulseGlow {
            from { outline-color: #f59e0b; }
            to { outline-color: #3b82f6; }
        }

        /* Floating Drag Element Override */
        .dragging-overlay {
            position: fixed !important;
            pointer-events: none !important;
            z-index: 9999 !important;
            opacity: 0.92;
            transform: scale(1.15) !important;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3) !important;
            transition: none !important;
        }

        /* Drop Target Slot Styling */
        .drop-slot {
            touch-action: none !important;
            transition: transform 0.15s ease, border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .drop-slot.drag-over {
            transform: scale(1.04);
            border-style: solid !important;
            border-color: #f59e0b !important;
            background-color: rgba(254, 243, 199, 0.85) !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5) !important;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes wobble {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px) rotate(-3deg); }
            40% { transform: translateX(6px) rotate(3deg); }
            60% { transform: translateX(-4px) rotate(-2deg); }
            80% { transform: translateX(4px) rotate(2deg); }
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-wobble {
            animation: wobble 0.35s ease-in-out;
        }
    </style>
</head>
<body class="h-screen max-h-screen w-screen flex flex-col transition-colors duration-500 p-2 sm:p-3 select-none overflow-hidden" id="app-body">

    <!-- Header Navigation Bar -->
    <header class="w-full max-w-6xl mx-auto flex items-center justify-between gap-1.5 shrink-0 mb-1 z-10">

        </div>

            </select>

            </select>

            <button id="next-month-btn" class="p-1 hover:bg-black/5 active:scale-90 rounded-xl text-base sm:text-lg font-black transition-all" title="Next Month">
                ▶️

        </div>

        <!-- Utility Action Buttons -->

            <button id="fullscreen-btn" class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-purple-600 hover:bg-purple-700 active:scale-95 text-white font-bold shadow-md transition-all text-xs sm:text-sm" title="Toggle Smartboard Fullscreen">

            <!-- Sound Mute Toggle -->

    <main class="w-full max-w-5xl mx-auto flex-1 min-h-0 flex flex-col gap-1.5">

            </h2>

            <!-- Completion Progress Bar -->
            <div class="max-w-xs mx-auto mt-1 bg-black/10 rounded-full h-1.5 p-0.5 backdrop-blur-sm overflow-hidden">

            </div>
        </div>

        <!-- Main Calendar Grid Area -->
        <div class="bg-white/90 backdrop-blur-md rounded-2xl p-2 sm:p-3 shadow-lg border border-white/80 flex-1 min-h-0 flex flex-col justify-between">
            
            <!-- Days of Week Headers -->
            <div class="grid grid-cols-7 gap-1 mb-1 text-center font-bold text-xs sm:text-sm shrink-0">
                <div class="py-0.5 sm:py-1 rounded-lg bg-red-100/90 text-red-700">Sun</div>
                <div class="py-0.5 sm:py-1 rounded-lg bg-blue-100/90 text-blue-700">Mon</div>
                <div class="py-0.5 sm:py-1 rounded-lg bg-blue-100/90 text-blue-700">Tue</div>
                <div class="py-0.5 sm:py-1 rounded-lg bg-blue-100/90 text-blue-700">Wed</div>
                <div class="py-0.5 sm:py-1 rounded-lg bg-blue-100/90 text-blue-700">Thu</div>
                <div class="py-0.5 sm:py-1 rounded-lg bg-blue-100/90 text-blue-700">Fri</div>
                <div class="py-0.5 sm:py-1 rounded-lg bg-red-100/90 text-red-700">Sat</div>
            </div>

            <!-- 7-Column Target Calendar Drop Grid -->
            <div id="calendar-days-grid" class="grid grid-cols-7 gap-1 sm:gap-1.5 flex-1 min-h-0 h-full">
                <!-- Drop slots generated dynamically -->
            </div>
        </div>

        <!-- Draggable & Selectable Number Bank Tray -->
        <div class="bg-white/90 backdrop-blur-md rounded-2xl p-2 shadow-lg border border-white/80 shrink-0 flex flex-col gap-1 max-h-[28vh] sm:max-h-[25vh]">
            <div class="flex items-center justify-between px-1 shrink-0">

                    <span>✨ Number Bank</span>
                    <span class="text-[10px] sm:text-xs font-normal text-gray-500 hidden md:inline">(Drag or tap a number, then tap a calendar slot)</span>
                </span>
                <button id="shuffle-btn" class="text-[11px] sm:text-xs font-semibold bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-0.5 rounded-lg transition-colors active:scale-95">
                    🔀 Shuffle

            </div>

            <!-- Number Bank Container -->
            <div id="number-bank" class="flex flex-wrap gap-1.5 sm:gap-2 justify-center items-center p-1.5 rounded-xl bg-gray-50/80 border border-dashed border-gray-200 overflow-y-auto flex-1 min-h-0">
                <!-- Draggable/Selectable tiles populated dynamically -->
            </div>
        </div>
    </main>

    <!-- Celebration Completion Modal -->
    <div id="completion-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-5 sm:p-7 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 border-4 border-amber-300" id="completion-card">
            <div id="modal-icon" class="text-5xl sm:text-6xl mb-1 animate-bounce">🎉</div>
            <h3 id="modal-title" class="text-2xl sm:text-3xl font-black text-gray-800 mb-1">Fantastic Job!</h3>
            <p id="modal-msg" class="text-sm sm:text-base font-semibold text-gray-600 mb-5">
                You completed the calendar!
            </p>
            <button id="modal-close-btn" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-2xl shadow-lg transition-transform active:scale-95 text-base sm:text-lg">
                🌟 Continue Exploring
            </button>

    </div>

            },

            },
            7: { // August

                tagline: "Warm sunshine and bright sunflowers!"
            },
            8: { // September
                name: "September",

                bgClass: "bg-yellow-50 text-amber-900",
                headerBg: "bg-gradient-to-r from-yellow-600 via-amber-600 to-red-500 text-white",
                slotStyle: "border-yellow-200 bg-yellow-50/40 hover:border-yellow-400",
                tileBg: "bg-amber-600 text-white shadow-amber-200 border-amber-300",
                decorLeft: "🍎", decorRight: "✏️", sticker: "📚",
                tagline: "Learning, growing, and crisp fall breezes!"
            },
            9: { // October
                name: "October",
                title: "Spooky Fall & Halloween",
                bgClass: "bg-amber-950/5 text-stone-800",
                headerBg: "bg-gradient-to-r from-orange-600 via-amber-600 to-purple-800 text-white",
                slotStyle: "border-orange-200 bg-orange-50/40 hover:border-orange-400",
                tileBg: "bg-orange-500 text-white shadow-orange-200 border-orange-300",
                decorLeft: "🎃", decorRight: "👻", sticker: "🎃",
                tagline: "Pumpkins, autumn leaves, and cozy treats!"
            },
            10: { // November
                name: "November",
                title: "Thanksgiving & Gratitude",
                bgClass: "bg-stone-100 text-amber-950",
                headerBg: "bg-gradient-to-r from-amber-700 via-orange-700 to-yellow-700 text-white",
                slotStyle: "border-amber-300 bg-amber-50/40 hover:border-amber-500",
                tileBg: "bg-amber-700 text-white shadow-amber-200 border-amber-300",
                decorLeft: "🦃", decorRight: "🍂", sticker: "🍁",
                tagline: "Gathering together with thankful hearts!"
            },
            11: { // December
                name: "December",
                title: "Winter Holidays",
                bgClass: "bg-sky-50 text-blue-950",
                headerBg: "bg-gradient-to-r from-blue-700 via-indigo-700 to-emerald-700 text-white",
                slotStyle: "border-indigo-200 bg-indigo-50/40 hover:border-indigo-400",
                tileBg: "bg-indigo-600 text-white shadow-indigo-200 border-indigo-300",
                decorLeft: "🎄", decorRight: "⛄", sticker: "🎁",
                tagline: "Joyful celebrations and winter cheer!"
            }
        };

        // Application State
        let currentYear, currentMonth;
        let placedDays = {}; // { dayNumber: true }
        let soundMuted = false;
        let selectedDayNumber = null; // Used for Tap-to-Select mode

        // Pointer Drag Tracking
        let activePointerId = null;
        let draggedTileElement = null;
        let floatingCloneElement = null;
        let pointerOffsetX = 0, pointerOffsetY = 0;
        let draggedDayValue = null;
        let currentHoveredSlot = null;

        // Audio Context Synthesizer
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (soundMuted) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(480, now);
                    osc.frequency.exponentialRampToValueAtTime(960, now + 0.12);
                    
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.2);

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.3, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.3);
                    });
                }
            } catch (e) {
                console.warn('Audio error:', e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();

            populateSelectors();
            loadStateForCurrentMonth();
            renderCalendar();

            // Android Smartboard Fullscreen Listeners
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            document.addEventListener('fullscreenchange', updateFullscreenUI);
            document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
            document.addEventListener('mozfullscreenchange', updateFullscreenUI);
            document.addEventListener('MSFullscreenChange', updateFullscreenUI);

            // Month / Year Navigation Event Handlers
            document.getElementById('month-select').addEventListener('change', (e) => {
                currentMonth = parseInt(e.target.value, 10);
                clearSelection();
                loadStateForCurrentMonth();
                renderCalendar();
            });

            document.getElementById('year-select').addEventListener('change', (e) => {
                currentYear = parseInt(e.target.value, 10);
                clearSelection();
                loadStateForCurrentMonth();
                renderCalendar();
            });

            document.getElementById('prev-month-btn').addEventListener('click', () => changeMonth(-1));
            document.getElementById('next-month-btn').addEventListener('click', () => changeMonth(1));

            document.getElementById('reset-btn').addEventListener('click', () => {
                if (confirm(`Reset calendar numbers for ${SEASONAL_THEMES[currentMonth].name}?`)) {
                    placedDays = {};
                    clearSelection();
                    saveStateForCurrentMonth();
                    renderCalendar();
                    playSound('pop');
                }
            });

            document.getElementById('shuffle-btn').addEventListener('click', () => {
                shuffleBankTiles();
                playSound('pop');
            });

            document.getElementById('sound-btn').addEventListener('click', (e) => {
                soundMuted = !soundMuted;
                e.target.textContent = soundMuted ? '🔇' : '🔊';
            });

            document.getElementById('modal-close-btn').addEventListener('click', hideCompletionModal);

            // Global Pointer Move & Up listeners for Dragging
            window.addEventListener('pointermove', handleGlobalPointerMove, { passive: false });
            window.addEventListener('pointerup', handleGlobalPointerUp, { passive: false });
            window.addEventListener('pointercancel', handleGlobalPointerUp, { passive: false });
        });

        function toggleFullscreen() {
            const doc = document;
            const docEl = document.documentElement;

            const isFullscreen = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

            if (!isFullscreen) {
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen();
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                } else if (docEl.mozRequestFullScreen) {
                    docEl.mozRequestFullScreen();
                } else if (docEl.msRequestFullscreen) {
                    docEl.msRequestFullscreen();
                }
            } else {
                if (doc.exitFullscreen) {
                    doc.exitFullscreen();
                } else if (doc.webkitExitFullscreen) {
                    doc.webkitExitFullscreen();
                } else if (doc.mozCancelFullScreen) {
                    doc.mozCancelFullScreen();
                } else if (doc.msExitFullscreen) {
                    doc.msExitFullscreen();
                }
            }
        }

        function updateFullscreenUI() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            const btnText = document.getElementById('fullscreen-btn-text');
            const btn = document.getElementById('fullscreen-btn');

            if (isFullscreen) {
                if (btnText) btnText.textContent = "Exit Fullscreen";
                btn.classList.remove('bg-purple-600', 'hover:bg-purple-700');
                btn.classList.add('bg-stone-700', 'hover:bg-stone-800');
            } else {
                if (btnText) btnText.textContent = "Fullscreen";
                btn.classList.remove('bg-stone-700', 'hover:bg-stone-800');
                btn.classList.add('bg-purple-600', 'hover:bg-purple-700');
            }
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            } else if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            
            document.getElementById('month-select').value = currentMonth;
            document.getElementById('year-select').value = currentYear;

            clearSelection();
            loadStateForCurrentMonth();
            renderCalendar();
            playSound('pop');
        }

        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        function getFirstDayOfWeek(year, month) {
            return new Date(year, month, 1).getDay();
        }

        function populateSelectors() {
            const monthSelect = document.getElementById('month-select');
            const yearSelect = document.getElementById('year-select');

            monthSelect.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = SEASONAL_THEMES[i].name;
                if (i === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }

            yearSelect.innerHTML = '';
            for (let y = currentYear - 3; y <= currentYear + 3; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }
        }

        function renderCalendar() {
            const theme = SEASONAL_THEMES[currentMonth];
            const daysInMonth = getDaysInMonth(currentYear, currentMonth);
            const startDayIndex = getFirstDayOfWeek(currentYear, currentMonth);

            // Apply seasonal theme classes
            document.body.className = `${theme.bgClass} h-screen max-h-screen w-screen flex flex-col transition-colors duration-500 p-2 sm:p-3 select-none overflow-hidden`;
            
            const headerCard = document.getElementById('calendar-header-card');
            headerCard.className = `rounded-2xl p-2 sm:p-2.5 text-center shadow-md transition-all duration-500 relative overflow-hidden border border-white/60 shrink-0 ${theme.headerBg}`;
            
            document.getElementById('calendar-month-title').textContent = `${theme.name} ${currentYear}`;
            document.getElementById('theme-tagline').textContent = theme.tagline;
            document.getElementById('theme-badge-icon').textContent = theme.sticker;
            document.getElementById('header-decor-left').textContent = theme.decorLeft;
            document.getElementById('header-decor-right').textContent = theme.decorRight;

            // Render Target Drop Slots
            const gridContainer = document.getElementById('calendar-days-grid');
            gridContainer.innerHTML = '';

            // Empty padding cells before 1st day of month
            for (let i = 0; i < startDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "rounded-xl bg-black/5 border border-transparent flex-1 min-h-0";
                gridContainer.appendChild(emptyCell);
            }

            // Render Clean Calendar Drop Slots
            for (let day = 1; day <= daysInMonth; day++) {
                const isPlaced = !!placedDays[day];

                const slot = document.createElement('div');
                slot.className = `drop-slot relative rounded-xl border-2 border-dashed flex flex-col items-center justify-center flex-1 min-h-0 p-0.5 transition-all ${theme.slotStyle}`;
                slot.dataset.day = day;

                // Slot Tap Listener for Tap-to-Place Mode
                slot.addEventListener('click', (e) => handleSlotClick(day, slot));

                // If already placed, display placed sticker tile
                if (isPlaced) {
                    const placedTile = createPlacedTileElement(day, theme);
                    slot.appendChild(placedTile);
                }

                gridContainer.appendChild(slot);
            }

            // Render Shuffled Number Bank
            renderNumberBank(daysInMonth, theme);

            // Update Completion Progress
            updateProgress(daysInMonth);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderNumberBank(daysInMonth, theme) {
            const bankContainer = document.getElementById('number-bank');
            bankContainer.innerHTML = '';

            let remainingNumbers = [];
            for (let d = 1; d <= daysInMonth; d++) {
                if (!placedDays[d]) {
                    remainingNumbers.push(d);
                }
            }

            if (remainingNumbers.length === 0) {
                bankContainer.innerHTML = `<div class="text-emerald-600 font-bold text-center py-1 text-xs sm:text-sm animate-pop">🎉 Great job! All numbers placed for ${SEASONAL_THEMES[currentMonth].name}!</div>`;
                return;
            }

            // Default shuffled state
            remainingNumbers = shuffleArray(remainingNumbers);

            remainingNumbers.forEach(day => {
                const tile = createDraggableTileElement(day, theme);
                bankContainer.appendChild(tile);
            });
        }

        function createDraggableTileElement(day, theme) {
            const tile = document.createElement('div');
            tile.className = `number-tile flex items-center justify-center w-9 h-9 sm:w-11 sm:h-11 md:w-12 md:h-12 text-base sm:text-xl font-black rounded-xl shadow border-2 transition-all shrink-0 ${theme.tileBg}`;
            tile.textContent = day;
            tile.dataset.day = day;

            // Selected Highlight state for Tap Mode
            if (selectedDayNumber === day) {
                tile.classList.add('selected-tile');
            }

            // Attach Unified Pointer Down listener
            tile.addEventListener('pointerdown', (e) => handleTilePointerDown(e, day, tile));

            return tile;
        }

        function createPlacedTileElement(day, theme) {
            const tile = document.createElement('div');
            tile.className = `w-full h-full flex flex-col items-center justify-center rounded-lg font-black text-sm sm:text-xl shadow-xs z-10 animate-pop ${theme.tileBg} relative overflow-hidden cursor-pointer`;
            
            tile.innerHTML = `
                <span class="leading-none">${day}</span>
                <span class="text-[10px] sm:text-xs leading-none mt-0.5 opacity-90">${theme.sticker}</span>
            `;

            tile.title = "Tap to return number to bank";
            tile.addEventListener('click', (e) => {
                e.stopPropagation();
                delete placedDays[day];
                clearSelection();
                saveStateForCurrentMonth();
                playSound('pop');
                renderCalendar();
            });

            return tile;
        }

        function shuffleBankTiles() {
            const bankContainer = document.getElementById('number-bank');
            const tiles = Array.from(bankContainer.children).filter(el => el.classList.contains('number-tile'));
            if (tiles.length <= 1) return;

            const shuffledTiles = shuffleArray(tiles);
            shuffledTiles.forEach(tile => bankContainer.appendChild(tile));
        }

        function clearSelection() {
            selectedDayNumber = null;
            document.querySelectorAll('.number-tile').forEach(t => t.classList.remove('selected-tile'));
        }

        let pointerStartX = 0, pointerStartY = 0;
        let isPointerDragging = false;

        function handleTilePointerDown(e, day, tileEl) {
            initAudio();
            e.preventDefault();
            e.stopPropagation();

            activePointerId = e.pointerId;
            draggedTileElement = tileEl;
            draggedDayValue = day;
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;
            isPointerDragging = false;

            const rect = tileEl.getBoundingClientRect();
            pointerOffsetX = e.clientX - rect.left;
            pointerOffsetY = e.clientY - rect.top;
        }

        function handleGlobalPointerMove(e) {
            if (!draggedTileElement || e.pointerId !== activePointerId) return;
            e.preventDefault();

            const distMoved = Math.hypot(e.clientX - pointerStartX, e.clientY - pointerStartY);

            // Initiate fluid drag overlay if moved > 6px
            if (!isPointerDragging && distMoved > 6) {
                isPointerDragging = true;

                // Create floating overlay clone
                floatingCloneElement = draggedTileElement.cloneNode(true);
                floatingCloneElement.classList.add('dragging-overlay');
                floatingCloneElement.style.width = `${draggedTileElement.offsetWidth}px`;
                floatingCloneElement.style.height = `${draggedTileElement.offsetHeight}px`;
                
                document.body.appendChild(floatingCloneElement);
                draggedTileElement.style.opacity = '0.35';
            }

            if (isPointerDragging && floatingCloneElement) {
                // Update position of floating clone
                floatingCloneElement.style.left = `${e.clientX - pointerOffsetX}px`;
                floatingCloneElement.style.top = `${e.clientY - pointerOffsetY}px`;

                // Smart Hit Testing on Android Smartboard WebView
                const targetElement = document.elementFromPoint(e.clientX, e.clientY);
                const dropSlot = targetElement ? targetElement.closest('.drop-slot') : null;

                if (currentHoveredSlot !== dropSlot) {
                    if (currentHoveredSlot) currentHoveredSlot.classList.remove('drag-over');
                    currentHoveredSlot = dropSlot;
                    if (currentHoveredSlot) currentHoveredSlot.classList.add('drag-over');
                }
            }
        }

        function handleGlobalPointerUp(e) {
            if (!draggedTileElement || e.pointerId !== activePointerId) return;
            e.preventDefault();

            if (isPointerDragging) {
                // Direct Drag & Drop completed
                if (currentHoveredSlot) {
                    currentHoveredSlot.classList.remove('drag-over');
                    const targetDay = parseInt(currentHoveredSlot.dataset.day, 10);
                    validateAndPlaceTile(draggedDayValue, targetDay, currentHoveredSlot);
                } else {
                    playSound('wrong');
                }
            } else {
                // Tap Gesture (Tap-to-Select Mode)
                if (selectedDayNumber === draggedDayValue) {
                    clearSelection();
                    playSound('pop');
                } else {
                    selectedDayNumber = draggedDayValue;
                    playSound('pop');
                    document.querySelectorAll('.number-tile').forEach(t => {
                        if (parseInt(t.dataset.day, 10) === selectedDayNumber) {
                            t.classList.add('selected-tile');
                        } else {
                            t.classList.remove('selected-tile');
                        }
                    });
                }
            }

            // Cleanup Dragging state
            if (floatingCloneElement && floatingCloneElement.parentNode) {
                floatingCloneElement.parentNode.removeChild(floatingCloneElement);
            }
            if (draggedTileElement) {
                draggedTileElement.style.opacity = '1';
            }

            if (currentHoveredSlot) {
                currentHoveredSlot.classList.remove('drag-over');
            }

            activePointerId = null;
            draggedTileElement = null;
            floatingCloneElement = null;
            draggedDayValue = null;
            currentHoveredSlot = null;
            isPointerDragging = false;
        }

        // Tap-to-Place Slot Handler
        function handleSlotClick(slotDay, slotElement) {
            if (!selectedDayNumber) return;

            validateAndPlaceTile(selectedDayNumber, slotDay, slotElement);
        }

        function validateAndPlaceTile(tileDay, slotDay, slotElement) {
            if (!tileDay || !slotDay) return;

            if (tileDay === slotDay) {
                // Correct Match
                placedDays[tileDay] = true;
                clearSelection();
                saveStateForCurrentMonth();
                playSound('pop');

                renderCalendar();

                const daysInMonth = getDaysInMonth(currentYear, currentMonth);
                if (Object.keys(placedDays).length === daysInMonth) {
                    triggerCompletion();
                }
            } else {
                // Soft Error Feedback
                playSound('wrong');
                slotElement.classList.add('animate-wobble', 'border-red-400', 'bg-red-50');
                
                setTimeout(() => {
                    slotElement.classList.remove('animate-wobble', 'border-red-400', 'bg-red-50');
                }, 350);
            }
        }

        function updateProgress(daysInMonth) {
            const placedCount = Object.keys(placedDays).length;
            const percent = Math.round((placedCount / daysInMonth) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        function getStorageKey() {
            return `montessori_cal_${currentYear}_${currentMonth}`;
        }

        function saveStateForCurrentMonth() {
            try {
                localStorage.setItem(getStorageKey(), JSON.stringify(placedDays));
            } catch (e) {
                console.warn('Unable to save to localStorage:', e);
            }
        }

        function loadStateForCurrentMonth() {
            try {
                const saved = localStorage.getItem(getStorageKey());
                if (saved) {
                    placedDays = JSON.parse(saved);
                } else {
                    placedDays = {};
                }
            } catch (e) {
                placedDays = {};
            }
        }

        function triggerCompletion() {
            playSound('win');

            const theme = SEASONAL_THEMES[currentMonth];
            document.getElementById('modal-icon').textContent = theme.sticker;
            document.getElementById('modal-title').textContent = `Awesome Job!`;
            document.getElementById('modal-msg').textContent = `You completed the whole calendar for ${theme.name} ${currentYear}!`;

            const modal = document.getElementById('completion-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('#completion-card').classList.remove('scale-90');
            modal.querySelector('#completion-card').classList.add('scale-100');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 140,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        function hideCompletionModal() {
            const modal = document.getElementById('completion-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('#completion-card').classList.remove('scale-100');
            modal.querySelector('#completion-card').classList.add('scale-90');
        }
    </script>
</body>
</html>
