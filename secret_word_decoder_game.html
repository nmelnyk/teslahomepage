<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Montessori Secret Word Decoder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: 0.6rem;
      gap: 0.5rem;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.8rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .app-title {
      font-size: clamp(0.95rem, 2vw, 1.4rem);
      font-weight: bold;
      color: #fbbf24;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .month-select-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .month-select {
      padding: 0.35rem 0.7rem;
      font-size: clamp(0.8rem, 1.4vw, 1rem);
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #fbbf24;
      background: #1e293b;
      color: #fff;
      cursor: pointer;
      outline: none;
    }

    .progress-badge {
      font-size: clamp(0.75rem, 1.2vw, 0.95rem);
      font-weight: bold;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn {
      padding: 0.35rem 0.75rem;
      font-size: clamp(0.8rem, 1.3vw, 0.95rem);
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.3);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }

    .btn-nav { background: #3b82f6; color: white; }
    .btn-fs { background: #10b981; color: white; }

    .word-counter {
      font-size: clamp(0.8rem, 1.4vw, 1rem);
      font-weight: bold;
      color: #e2e8f0;
      background: rgba(0,0,0,0.3);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .solved-tag {
      color: #4ade80;
      font-size: 0.85em;
    }

    /* MAIN GAME BOARD */
    .game-board {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      border-radius: 16px;
      border: 2px dashed rgba(255,255,255,0.18);
      padding: 0.4rem;
      position: relative;
      overflow: hidden;
    }

    .word-target-container {
      display: flex;
      gap: clamp(0.3rem, 1.4vw, 1rem);
      justify-content: center;
      align-items: center;
      margin: auto;
    }

    .letter-slot-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

      font-size: clamp(2rem, 5.5vw, 3.8rem);
