<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Montessori Secret Word Decoder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: 0.6rem;
      gap: 0.5rem;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.8rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .app-title {
      font-size: clamp(0.95rem, 2vw, 1.4rem);
      font-weight: bold;
      color: #fbbf24;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }

    .month-select-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .month-select {
      padding: 0.35rem 0.7rem;
      font-size: clamp(0.8rem, 1.4vw, 1rem);
      font-weight: bold;
      border-radius: 8px;
      border: 2px solid #fbbf24;
      background: #1e293b;
      color: #fff;
      cursor: pointer;
      outline: none;
    }

    .progress-badge {
      font-size: clamp(0.75rem, 1.2vw, 0.95rem);
      font-weight: bold;
      color: #4ade80;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn {
      padding: 0.35rem 0.75rem;
      font-size: clamp(0.8rem, 1.3vw, 0.95rem);
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.3);
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.3);
    }

    .btn-nav { background: #3b82f6; color: white; }
    .btn-fs { background: #10b981; color: white; }

    .word-counter {
      font-size: clamp(0.8rem, 1.4vw, 1rem);
      font-weight: bold;
      color: #e2e8f0;
      background: rgba(0,0,0,0.3);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .solved-tag {
      color: #4ade80;
      font-size: 0.85em;
    }

    /* MAIN GAME BOARD */
    .game-board {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      border-radius: 16px;
      border: 2px dashed rgba(255,255,255,0.18);
      padding: 0.4rem;
      position: relative;
      overflow: hidden;
    }

    .word-target-container {
      display: flex;
      gap: clamp(0.3rem, 1.4vw, 1rem);
      justify-content: center;
      align-items: center;
      margin: auto;
    }

    .letter-slot-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }

    .picture-prompt {
      font-size: clamp(2rem, 5.5vw, 3.8rem);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      line-height: 1;
    }

    .letter-slot {
      width: clamp(2.6rem, 6.5vw, 4.4rem);
      height: clamp(2.6rem, 6.5vw, 4.4rem);
      border: 3px dashed #64748b;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 3.8vw, 2.6rem);
      font-weight: bold;
      color: #f8fafc;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .letter-slot.selected {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.15);
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
    }

    .letter-slot.correct {
      border-color: #22c55e;
      border-style: solid;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    /* ALPHABET KEYPAD GRID */
    .code-grid-container {
      flex-shrink: 0;
      background: rgba(30, 41, 59, 0.85);
      border-radius: 14px;
      padding: 0.4rem;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .code-grid-header {
      font-size: clamp(0.7rem, 1.1vw, 0.85rem);
      text-align: center;
      color: #94a3b8;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .code-grid {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 0.25rem;
    }

    @media (max-width: 768px) {
      .code-grid {
        grid-template-columns: repeat(9, 1fr);
      }
    }

    .key-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 0.15rem 0.05rem;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .key-tile:hover, .key-tile:active {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .key-icon {
      font-size: clamp(1rem, 2.1vw, 1.5rem);
      line-height: 1;
    }

    .key-letter {
      font-size: clamp(0.7rem, 1.3vw, 1rem);
      font-weight: bold;
      color: #fbbf24;
      text-transform: uppercase;
      margin-top: 0.05rem;
    }

    /* DRAG GHOST */
    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      font-size: 2.2rem;
      font-weight: bold;
      color: #fbbf24;
      background: rgba(15, 23, 42, 0.95);
      padding: 0.3rem 0.7rem;
      border-radius: 10px;
      border: 2px solid #fbbf24;
      transform: translate(-50%, -50%);
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* CONFETTI CANVAS */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div id="drag-ghost" class="drag-ghost"></div>

<div class="app-container">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="app-title">🔍 Secret Word Decoder</div>
      <div class="month-select-group">
        <select id="month-select" class="month-select" onchange="changeMonth(this.value)"></select>
        <div id="progress-badge" class="progress-badge">0 / 30 Solved</div>
      </div>
    </div>
    <div class="header-controls">
      <button class="btn btn-nav" onclick="prevWord()">◀ Prev</button>
      <div id="word-counter" class="word-counter">Word 1 / 30</div>
      <button class="btn btn-nav" onclick="nextWord()">Next ▶</button>
      <button class="btn btn-fs" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
  </div>

  <!-- GAME BOARD -->
  <div class="game-board">
    <div id="word-target" class="word-target-container"></div>
  </div>

  <!-- ALPHABET CODE GRID -->
  <div class="code-grid-container">
    <div class="code-grid-header">Alphabet Code Key (Tap or Drag Letters)</div>
    <div id="code-grid" class="code-grid"></div>
  </div>
</div>

<script>
  // 12 MONTH THEME ICONS (Strict 1-to-1 unique mapping for A-Z)
  const MONTH_THEMES = {
    0: { name: "January ❄️", icons: ["❄️","⛄","🧊","🎿","⛷️","🧤","🧣","🏔️","🐧","🛷","💨","🌨️","🐻","☕","🥣","🔥","🌲","🪵","🌬️","🔔","🗓️","🧊","👑","✨","🎆","🎉"] },
    1: { name: "February 💕", icons: ["❤️","💖","💌","🎁","🌹","🍫","🧸","💘","🎀","👑","💍","🕊️","🧁","🌸","⭐","✨","💌","🩰","🍯","🕯️","📜","💐","💎","🎂","🥳","🥂"] },
    2: { name: "March ☘️", icons: ["☘️","🍀","🌈","🎩","🪙","🏺","🌱","🌧️","☀️","🪁","🌷","🦋","🐝","🌾","🦜","🍃","🍀","🌟","🌼","🍄","🌤️","👟","🚲","🌿","💚","💛"] },
    3: { name: "April 🌧️", icons: ["🌧️","☂️","🐣","🐰","🥚","🌷","🌸","🌱","🦋","🐝","💧","🌻","🌱","🐞","🌦️","🌈","🪺","🧺","🎨","🍬","🪻","🧼","🐸","🌾","🌼","☀️"] },
    4: { name: "May 🌺", icons: ["🌺","🌻","🐝","🦋","🌸","🌷","☀️","🪴","🧺","🌿","🐜","🐞","🌾","🕊️","🍄","💐","🚲","🍋","🫐","🥑","🌈","☀️","🌱","🌳","☀️","🪷"] },
    5: { name: "June ☀️", icons: ["☀️","🏖️","🌊","🕶️","🍦","🍉","🐬","🌴","🐚","🦀","⛵","🏊","🍹","🏄","🍉","🧢","🌺","🏝️","🦩","⛱️","🩴","⛵","☀️","🏄‍♂️","🍧","☀️"] },
    6: { name: "July 🎆", icons: ["🎆","🎆","⭐","🗽","🌭","🍔","🍦","🚀","🎇","🎉","🦅","🏕️","☀️","🍉","🫐","🥧","💦","🎺","🥁","🎈","🔔","🌟","💙","❤️","🤍","✨"] },
    7: { name: "August 🏕️", icons: ["🏕️","🌲","🪵","🔥","🧭","🎒","🛶","🎣","🐻","🦉","🔦","🌌","⛺","🧗","🪵","🌭","🌌","🌲","🌄","🫐","🐛","🪵","🗺️","🛶","🌄","🪵"] },
    8: { name: "September 🎒", icons: ["🎒","📚","✏️","🍎","🚌","🏫","📏","✂️","🎨","⚽","🔔","📝","📐","🖍️","💻","🧠","⭐","🧪","🌍","📌","🎓","🧩","⚽","🎵","📖","🔍"] },
    9: { name: "October 🎃", icons: ["🎃","🧹","👻","🧙","🦇","🐈‍⬛","🕷️","🕸️","🍬","🍭","🍎","🌙","🦉","🧛","🔮","⚰️","☠️","🏚️","🕯️","🧪","🌾","🍁","🍂","🌽","🧟","👺"] },
    10: { name: "November 🦃", icons: ["🦃","🥧","🍂","🍁","🌾","🌽","🥖","🍎","🥕","🥔","🪵","🕯️","🌰","🏡","🍽️","🍗","🍷","🍵","🤎","🧡","💛","🍲","🧺","🤝","🍁","📜"] },
    11: { name: "December 🎄", icons: ["🎄","🎁","🎅","🤶","🦌","⛄","🔔","🕯️","⭐","🍪","🥛","🧦","🧊","❄️","🕊️","🎀","🎶","👼","🏰","🏔️","🔥","🪵","✨","🎉","🎆","❄️"] }
  };

  const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  
  // 30 Words Per Month
  const MONTH_WORDS = {
    0: ["SNOW", "COLD", "ICE", "SLATE", "MITT", "FROST", "CHILL", "SLED", "SKI", "BOOT", "HAT", "COAT", "MELT", "FLAKE", "WHITE", "WINTER", "STORM", "NORTH", "PENGUIN", "BEAR", "GLOVE", "SCARF", "FIRE", "SOUP", "HOT", "FREEZE", "DRIFT", "BLAST", "PUFF", "PEAK"],
    1: ["LOVE", "HEART", "PINK", "CARD", "GIFT", "ROSE", "SWEET", "KISS", "HUG", "FRIEND", "KIND", "RING", "DEAR", "VALENTINE", "BEAR", "CANDY", "CAKE", "RED", "SMILE", "BEST", "GIVE", "CARE", "HAPPY", "WARM", "GOLD", "STAR", "CUPID", "BOW", "SOFT", "TRUE"],
    2: ["LUCK", "GREEN", "RAIN", "GOLD", "WIND", "KITE", "MARCH", "SPRING", "SEED", "GROW", "BUD", "SUN", "SHINE", "SHAMROCK", "CLOVER", "COIN", "POT", "IRISH", "BIRD", "NEST", "WORM", "MUD", "PUDDLE", "BOOTS", "BLOOM", "LEAF", "GRASS", "MINT", "WISH", "CHARM"],
    3: ["RAIN", "EASTER", "BUNNY", "EGG", "DUCK", "CHICK", "SPRING", "BLOOM", "FLOWER", "NEST", "BIRD", "TREE", "PUDDLE", "DROP", "WET", "GREEN", "BEE", "BUG", "GARDEN", "PLANT", "DIRT", "SHOWERS", "MAY", "APRIL", "BASKET", "HUNT", "GRASS", "SOFT", "SWEET", "WARM"],
    4: ["FLOWER", "GARDEN", "PLANT", "SEED", "MAY", "BLOOM", "PETAL", "ROSE", "BEE", "BUG", "SUN", "WARM", "GROW", "LEAF", "STEM", "ROOT", "DIRT", "HOE", "YARD", "PARK", "TREE", "BIRD", "SONG", "SPRING", "SWEET", "FRESH", "GREEN", "SOIL", "BUD", "BEETLE"],
    5: ["SUMMER", "SUN", "BEACH", "SAND", "SWIM", "HOT", "POOL", "WAVE", "FISH", "SHELL", "BOAT", "SURF", "CAMP", "PARK", "TRIP", "FUN", "PLAY", "ICE", "POP", "COOL", "DIVE", "FLOAT", "SAIL", "SEA", "CRAB", "SHARK", "SHADE", "FAN", "JUNE", "DAY"],
    6: ["STAR", "FLAG", "RED", "WHITE", "BLUE", "FIREWORK", "BOOM", "JULY", "PARADE", "DRUM", "PROUD", "FREE", "LAND", "HOME", "SUMMER", "CAMP", "HOT", "SUN", "PICNIC", "COOK", "CHIPS", "POP", "SPARK", "GLOW", "NIGHT", "SKY", "SING", "BAND", "HERO", "BEST"],
    7: ["CAMP", "TENT", "FIRE", "WOOD", "HIKE", "WALK", "TREE", "PARK", "LAKE", "BOAT", "FISH", "BEAR", "STAR", "MOON", "NIGHT", "DARK", "COOK", "PACK", "PATH", "HILL", "BUG", "BIRD", "TRAIL", "HOT", "SUMMER", "AUGUST", "SUN", "REST", "TRIP", "PADDLE"],
    8: ["SCHOOL", "BOOK", "READ", "WRITE", "DESK", "BUS", "BELL", "MATH", "ART", "PEN", "PAPER", "TEACH", "LEARN", "CLASS", "FRIEND", "LUNCH", "PLAY", "RULES", "BAG", "GRADE", "FIRST", "ABC", "NUMBERS", "DRAW", "SING", "WORK", "TEST", "SIT", "KIND", "BEST"],
    9: ["SPOOKY", "GHOST", "WITCH", "BAT", "CAT", "PUMPKIN", "CANDY", "BOO", "MASK", "COSTUME", "NIGHT", "MOON", "DARK", "OWL", "SPIDER", "WEB", "BROOM", "TREAT", "TRICK", "FALL", "OCTOBER", "BONE", "HAUNT", "HALL", "BLACK", "ORANGE", "BAG", "SCARE", "MAGIC", "TOOTH"],
    10: ["FEAST", "THANK", "TURKEY", "PIE", "FALL", "LEAF", "CORN", "FOOD", "FAMILY", "HOME", "GIVE", "KIND", "COOK", "DINNER", "BREAD", "YAM", "SQUASH", "NUTS", "HARVEST", "BROWN", "GOLD", "COLD", "WIND", "WOOD", "PUMP", "BAKE", "SHARE", "BLESS", "MAY", "FULL"],
    11: ["GIFT", "TREE", "SANTA", "ELFF", "BELL", "STAR", "SNOW", "COLD", "MERRY", "JOLLY", "JOY", "PEACE", "TOY", "WRAP", "SING", "SONG", "DEER", "SLEIGH", "NORTH", "POLE", "ICE", "LIGHT", "GLOW", "CARD", "WINTER", "HOLIDAY", "CHURCH", "ANGEL", "CHIMNEY", "WISH"]
  };

  let currentMonthIndex = 0;
  let currentWordIndex = 0;
  let currentWord = "";
  let userLetters = [];
  let selectedSlotIndex = 0;
  
  // Storage Key for Session Persistence
  const STORAGE_KEY = "decoder_completed_words_v1";
  let completedWords = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  function isWordSolved(mIdx, wIdx) {
    return !!(completedWords[mIdx] && completedWords[mIdx][wIdx]);
  }

  function markWordSolved(mIdx, wIdx) {
    if (!completedWords[mIdx]) completedWords[mIdx] = {};
    completedWords[mIdx][wIdx] = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(completedWords));
  }

  function getMonthProgress(mIdx) {
    if (!completedWords[mIdx]) return 0;
    return Object.keys(completedWords[mIdx]).length;
  }

  // Audio Synth
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, type = 'sine', duration = 0.1) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playWinSound() {
    const notes = [261.63, 329.63, 392.00, 523.25];
    notes.forEach((freq, idx) => {
      setTimeout(() => playSound(freq, 'triangle', 0.22), idx * 110);
    });
  }

  // APP INITIALIZATION
  window.addEventListener('DOMContentLoaded', () => {
    const realMonth = new Date().getMonth();
    currentMonthIndex = realMonth;

    const monthSelect = document.getElementById('month-select');
    Object.keys(MONTH_THEMES).forEach(idx => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.innerText = MONTH_THEMES[idx].name;
      if (parseInt(idx) === realMonth) opt.selected = true;
      monthSelect.appendChild(opt);
    });

    loadMonth(currentMonthIndex);
    setupTouchDragging();
  });

  function changeMonth(idx) {
    currentMonthIndex = parseInt(idx);
    currentWordIndex = getFirstUnsolvedIndex(currentMonthIndex);
    loadMonth(currentMonthIndex);
  }

  function getFirstUnsolvedIndex(mIdx) {
    const total = MONTH_WORDS[mIdx].length;
    for (let i = 0; i < total; i++) {
      if (!isWordSolved(mIdx, i)) return i;
    }
    return 0; // default to first if all solved
  }

  function loadMonth(monthIdx) {
    renderAlphabetGrid(monthIdx);
    updateProgressUI();
    loadWord(currentWordIndex);
  }

  function updateProgressUI() {
    const solvedCount = getMonthProgress(currentMonthIndex);
    const total = MONTH_WORDS[currentMonthIndex].length;
    document.getElementById('progress-badge').innerText = `${solvedCount} / ${total} Solved`;
  }

  function renderAlphabetGrid(monthIdx) {
    const grid = document.getElementById('code-grid');
    grid.innerHTML = "";
    const icons = MONTH_THEMES[monthIdx].icons;

    ALPHABET.forEach((letter, i) => {
      const tile = document.createElement('div');
      tile.className = 'key-tile';
      tile.setAttribute('data-letter', letter);
      tile.innerHTML = `
        <div class="key-icon">${icons[i] || '❓'}</div>
        <div class="key-letter">${letter}</div>
      `;
      tile.onclick = () => onKeyTap(letter);
      grid.appendChild(tile);
    });
  }

  function loadWord(wordIdx) {
    const words = MONTH_WORDS[currentMonthIndex];
    currentWord = words[wordIdx % words.length].toUpperCase();
    
    // If word is already solved, pre-fill it
    const solved = isWordSolved(currentMonthIndex, wordIdx);
    if (solved) {
      userLetters = currentWord.split("");
    } else {
      userLetters = new Array(currentWord.length).fill("");
    }
    
    selectedSlotIndex = 0;

    const counterElem = document.getElementById('word-counter');
    counterElem.innerHTML = `Word ${wordIdx + 1} / ${words.length} ${solved ? '<span class="solved-tag">✓ Solved</span>' : ''}`;
    renderWordTarget();
  }

  function renderWordTarget() {
    const container = document.getElementById('word-target');
    container.innerHTML = "";
    const themeIcons = MONTH_THEMES[currentMonthIndex].icons;

    for (let i = 0; i < currentWord.length; i++) {
      const targetLetter = currentWord[i];
      const letterIndex = ALPHABET.indexOf(targetLetter);
      const icon = letterIndex !== -1 ? themeIcons[letterIndex] : '❓';

      const group = document.createElement('div');
      group.className = 'letter-slot-group';

      const prompt = document.createElement('div');
      prompt.className = 'picture-prompt';
      prompt.innerText = icon;

      const slot = document.createElement('div');
      slot.className = 'letter-slot';
      if (i === selectedSlotIndex) slot.classList.add('selected');
      if (userLetters[i] === currentWord[i]) slot.classList.add('correct');
      slot.innerText = userLetters[i];
      slot.onclick = () => {
        selectedSlotIndex = i;
        renderWordTarget();
        playSound(400, 'sine', 0.05);
      };

      group.appendChild(prompt);
      group.appendChild(slot);
      container.appendChild(group);
    }
  }

  function onKeyTap(letter) {
    if (selectedSlotIndex < currentWord.length) {
      userLetters[selectedSlotIndex] = letter;
      playSound(520, 'sine', 0.08);

      let nextEmpty = userLetters.findIndex((l, idx) => l === "" && idx > selectedSlotIndex);
      if (nextEmpty === -1) nextEmpty = userLetters.findIndex(l => l === "");
      if (nextEmpty !== -1) selectedSlotIndex = nextEmpty;

      renderWordTarget();
      checkWordComplete();
    }
  }

  function checkWordComplete() {
    if (userLetters.join("") === currentWord) {
      if (!isWordSolved(currentMonthIndex, currentWordIndex)) {
        markWordSolved(currentMonthIndex, currentWordIndex);
        updateProgressUI();
        playWinSound();
        triggerConfetti();
        setTimeout(() => {
          nextWord();
        }, 1600);
      }
    }
  }

  function nextWord() {
    currentWordIndex = (currentWordIndex + 1) % MONTH_WORDS[currentMonthIndex].length;
    loadWord(currentWordIndex);
  }

  function prevWord() {
    currentWordIndex = (currentWordIndex - 1 + MONTH_WORDS[currentMonthIndex].length) % MONTH_WORDS[currentMonthIndex].length;
    loadWord(currentWordIndex);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  // TOUCH DRAG & DROP IMPLEMENTATION
  function setupTouchDragging() {
    const ghost = document.getElementById('drag-ghost');
    let activeLetter = null;

    document.addEventListener('touchstart', (e) => {
      const tile = e.target.closest('.key-tile');
      if (tile) {
        activeLetter = tile.getAttribute('data-letter');
        ghost.innerText = activeLetter;
        ghost.style.display = 'block';
        moveGhost(e.touches[0]);
      }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (activeLetter) {
        moveGhost(e.touches[0]);
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (activeLetter) {
        const touch = e.changedTouches[0];
        const elem = document.elementFromPoint(touch.clientX, touch.clientY);
        const slotGroup = elem ? elem.closest('.letter-slot-group') : null;
        
        if (slotGroup) {
          const slots = Array.from(document.querySelectorAll('.letter-slot-group'));
          const slotIdx = slots.indexOf(slotGroup);
          if (slotIdx !== -1) {
            selectedSlotIndex = slotIdx;
            onKeyTap(activeLetter);
          }
        }
        activeLetter = null;
        ghost.style.display = 'none';
      }
    });

    function moveGhost(touch) {
      ghost.style.left = touch.clientX + 'px';
      ghost.style.top = touch.clientY + 'px';
    }
  }

  // CONFETTI ANIMATION
  function triggerConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = Array.from({ length: 70 }, () => ({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.7) * 14,
      size: Math.random() * 10 + 6,
      color: `hsl(${Math.random() * 360}, 90%, 60%)`
    }));

    let frame = 0;
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      if (frame++ < 50) requestAnimationFrame(animate);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    animate();
  }
</script>
